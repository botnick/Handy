# Temporary: proves the remote transcription branch on every desktop OS,
# including the real system keychain. Not part of the pull request.
name: remote transcription, cross-platform
on:
  workflow_dispatch:
  push:
    branches: [ci-cross-platform]

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Same packages as the repo's test.yml, plus a Secret Service to store
      # keys in (gnome-keyring) and a session bus for it.
      - name: System dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers gnome-keyring dbus-x11

      # As in the repo's build.yml.
      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # The test binary links vulkan-1.dll, which comes with GPU drivers that
      # runners don't have. Install the Vulkan runtime (the loader) silently.
      - name: Vulkan runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\VulkanRT.exe"
          Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/1.4.309.0/windows/VulkanRT-1.4.309.0-Installer.exe -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          Get-ChildItem C:\Windows\System32\vulkan-1.dll | ForEach-Object { $_.FullName }

      # As in the repo's build.yml: ggml-vulkan needs SPIRV-Headers, which the
      # CI Vulkan SDK doesn't make findable.
      - name: SPIRV-Headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      # The test binary is run straight from target/, not from a bundle, so
      # the DLLs the build produced (transcribe-cpp, ggml) aren't next to it.
      - name: Build tests, then put their DLLs on PATH (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --lib --no-run
          Get-ChildItem -Recurse -Filter *.dll target | ForEach-Object { $_.DirectoryName } | Sort-Object -Unique | ForEach-Object {
            Write-Host $_
            Add-Content $env:GITHUB_PATH $_
          }

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Keychain, against the real store (macOS, Windows)
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo test --lib keychain -- --ignored

      - name: Keychain, against the real store (Linux Secret Service)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --lib keychain -- --ignored
          '

      - name: Frontend
        if: runner.os == 'Linux'
        run: |
          bun install
          bunx tsc --noEmit
          bun run lint
          bun run format:check
          bun run check:translations

      - name: UI tests
        if: runner.os == 'Linux'
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test tests/remote-transcription.spec.ts --reporter=line

  # The OS credential store, tested on its own: no models, no Vulkan, no
  # window, so nothing but the keychain code can make it fail.
  keychain:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ci/keychain-check
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Secret Service (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11
      - name: Real credential store (macOS, Windows)
        if: runner.os != 'Linux'
        run: cargo test
      - name: Real credential store (Linux Secret Service)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test
          '
